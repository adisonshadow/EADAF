services:
  postgres:
    image: postgres:16-alpine
    container_name: EADAF-dev-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-eadaf_db}
      POSTGRES_USER: ${POSTGRES_USER:-my_name}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - EADAF_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_name} -d ${POSTGRES_DATABASE:-eadaf_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: EADAF-dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-26379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - EADAF_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: EADAF-dev-mysql
    restart: always
    ports:
      - "${MYSQL_PORT:-23306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bizdata}
    volumes:
      - EADAF_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: EADAF-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eadaf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eadaf-minio-secret}
    volumes:
      - EADAF_minio_data:/data
    healthcheck:
      # mc ready 内部每 5 秒重试并打印一行，数据目录或 MC_CONFIG_DIR 不存在时会一直写。
      # live 只探本节点 HTTP，一次退出，不扫盘、不写 mc 配置。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  EADAF_postgres_data:
  EADAF_redis_data:
  EADAF_mysql_data:
  EADAF_minio_data:
