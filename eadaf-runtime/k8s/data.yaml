apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eadaf-postgres
  namespace: eadaf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: eadaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eadaf-postgres
  template:
    metadata:
      labels:
        app: eadaf-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: eadaf-env
                  key: POSTGRES_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: eadaf-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: eadaf-env
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eadaf-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: eadaf
spec:
  selector:
    app: eadaf-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eadaf-redis
  namespace: eadaf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: eadaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eadaf-redis
  template:
    metadata:
      labels:
        app: eadaf-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eadaf-redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: eadaf
spec:
  selector:
    app: eadaf-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eadaf-mysql
  namespace: eadaf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: eadaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eadaf-mysql
  template:
    metadata:
      labels:
        app: eadaf-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: eadaf-env
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: eadaf-env
                  key: MYSQL_DATABASE
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eadaf-mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: eadaf
spec:
  selector:
    app: eadaf-mysql
  ports:
    - port: 3306
      targetPort: 3306
