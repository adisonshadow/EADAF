apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eadaf-minio
  namespace: eadaf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: eadaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eadaf-minio
  template:
    metadata:
      labels:
        app: eadaf-minio
    spec:
      containers:
        - name: minio
          image: eadaf-minio:v1
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  name: eadaf-env
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: eadaf-env
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eadaf-minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: eadaf
spec:
  selector:
    app: eadaf-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eadaf-api
  namespace: eadaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eadaf-api
  template:
    metadata:
      labels:
        app: eadaf-api
    spec:
      containers:
        - name: api
          image: eadaf-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9526
              hostPort: __API_HOST_PORT__
          env:
            - name: NODE_ENV
              value: production
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: "9526"
          envFrom:
            - configMapRef:
                name: eadaf-env
---
apiVersion: v1
kind: Service
metadata:
  name: eadaf-api
  namespace: eadaf
spec:
  selector:
    app: eadaf-api
  ports:
    - port: 9526
      targetPort: 9526
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eadaf-web
  namespace: eadaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eadaf-web
  template:
    metadata:
      labels:
        app: eadaf-web
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9527
              hostPort: __WEB_HOST_PORT__
          volumeMounts:
            - name: dist
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: dist
          hostPath:
            path: __DEPLOY_ROOT__/frontend/dist
            type: Directory
        - name: conf
          hostPath:
            path: __DEPLOY_ROOT__/nginx/conf
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: eadaf-web
  namespace: eadaf
spec:
  selector:
    app: eadaf-web
  ports:
    - port: 9527
      targetPort: 9527
