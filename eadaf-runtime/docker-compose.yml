services:
  eadaf-web:
    image: nginx:1.25-alpine
    container_name: EADAF-web
    restart: unless-stopped
    ports:
      - "${EADAF_WEB_HOST_PORT:-9527}:9527"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      eadaf-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9527/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  eadaf-api:
    image: eadaf-api:v1
    container_name: EADAF-api
    restart: unless-stopped
    ports:
      - "${EADAF_API_HOST_PORT:-9526}:9526"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_HOST: "0.0.0.0"
      API_PORT: "9526"
      LOG_FILE: /data/logs/app.log
      DB_BACKUP_DIR: /data/db-backup
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-eadaf}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-eadaf-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-eadaf}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./logs/api:/data/logs
      - eadaf_db_backup:/data/db-backup
      - ./.env:/app/backend/.env.production:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9526/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: EADAF-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-35432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-eadaf_db}
      POSTGRES_USER: ${POSTGRES_USER:-my_name}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - EADAF_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_name} -d ${POSTGRES_DATABASE:-eadaf_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: EADAF-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-36379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - EADAF_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: EADAF-mysql
    restart: always
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bizdata}
    volumes:
      - EADAF_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: eadaf-minio:v1
    container_name: EADAF-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eadaf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eadaf-minio-secret}
    volumes:
      - eadaf_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  EADAF_postgres_data:
  EADAF_redis_data:
  EADAF_mysql_data:
  eadaf_minio_data:
  eadaf_db_backup:
