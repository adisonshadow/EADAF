packages:
  # AI Base 源码包
  - "package/ai-base"
  # 业务项目 （AI Base 业务项目）
  - "frontend"
  - "backend"
  # AI Base demo 项目
  - "app_example"
allowBuilds:
  '@parcel/watcher': true
  es5-ext: true
  esbuild: true
  sharp: true
overrides:
  "@types/react": "^19.2.17"
  "@types/react-dom": "^19.2.3"
  # 1.9.0 发布未满服务器 minimumReleaseAge（约 1 天）会拦安装；1.8.1 已足够旧
  b4a: "1.8.1"
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc